[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "syncopy"
version = "0.1.0"
description = "Reliable, proportional Polymarket copy-trading service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.11,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "certifi>=2025.1",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn>=0.34,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
live = ["polymarket-client>=0.2,<0.3"]
backtest = ["numpy>=2,<3", "pandas>=2.2,<3"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
syncopy = "syncopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syncopy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
