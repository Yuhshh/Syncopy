services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: syncopy
      POSTGRES_USER: syncopy
      POSTGRES_PASSWORD: syncopy
    volumes:
      - syncopy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncopy -d syncopy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  syncopy:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://syncopy:syncopy@postgres:5432/syncopy
    command: ["sh", "-c", "alembic upgrade head && syncopy run"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  syncopy-postgres:

